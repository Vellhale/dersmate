# Bu şablon docker-compose.prod.yml ile birlikte kullanılmak üzere yazıldı:
# nginx kendi konteynerinde çalışır, API'ye compose ağı üzerinden (api:8080)
# gider ve arayüz paketini /usr/share/nginx/html altından servis eder.
# Kopyalarken YALNIZCA alan adlarını değiştirin (bkz. docs/SUNUCUYA-KURULUM.md §3).

# ─────────────────────────────────────────────────────────────────────────────
# dersmate — ters vekil yapılandırması (nginx)
#
# ŞABLON: alan adlarını kendi alan adınla değiştirip `deploy/nginx.conf` olarak
# kopyala (bkz. docs/SUNUCUYA-KURULUM.md §3). deploy/ .gitignore'da.
#
# ⚠️ BU DOSYA docker-compose.prod.yml İÇİN YAZILDI, sunucuya elle kurulmuş bir
#    nginx için değil. İki fark var ve ikisi de sessizce her şeyi bozar:
#
#      • proxy_pass http://api:8080  — "api" compose ağındaki servis adı.
#        127.0.0.1 YAZILAMAZ: konteynerin içinde 127.0.0.1, nginx'in kendisidir;
#        uygulamaya değil kendine istek atar ve 502 döner.
#      • root /usr/share/nginx/html — compose frontend/dist'i buraya bağlıyor.
#
#    nginx'i konteyner yerine sunucuya doğrudan kurduysan: proxy_pass'i
#    http://127.0.0.1:5000 yap ve root'u dist klasörünün gerçek yoluna çevir.
#
# Uygulama TLS'i KENDİSİ sonlandırmıyor (bkz. docs/URETIME-CIKIS.md §3). Bu
# yapılandırma üç işi yapıyor ve üçü de zorunlu:
#   1. HTTP → HTTPS yönlendirmesi (uygulama UseHttpsRedirection çağırmıyor)
#   2. X-Forwarded-For / X-Forwarded-Proto başlıklarını geçirmek — bunlar
#      olmadan IP başına hız sınırı TEK KOVAYA döner ve tüm sitenin trafiği
#      vekilin tek IP'sinde toplanır
#   3. WebSocket yükseltmesi (SignalR sohbet bağlantısı)
#
# ⚠️ API PORTU DIŞARIYA AÇIK OLMAMALI. compose yalnızca 127.0.0.1'e bağlıyor.
#    Uygulama KnownProxies listesini temizliyor, yani X-Forwarded-For başlığına
#    koşulsuz güveniyor; doğrudan ulaşabilen biri başlığı uydurup hız sınırını
#    atlayabilir. Bu ödünç, vekilin tek giriş olması şartıyla veriliyor.
# ─────────────────────────────────────────────────────────────────────────────

# Upgrade başlığı yoksa Connection "close" olmalı; sabit "upgrade" yazmak
# sıradan HTTP isteklerini de yükseltmeye çalışır.
#
# `map` yalnızca http bağlamında geçerli. Bu dosya /etc/nginx/conf.d/ altına
# konuyor ve oradan http {} içine include ediliyor — yani burada doğru yerde.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ARAYÜZ CSP'si — TEK KAYNAKTAN. Aşağıdaki `add_header` miras tuzağı yüzünden bu başlık
# arayüz bloğunda ÜÇ ayrı yerde tekrar edilmek zorunda (server + /assets/ + /index.html).
# Uzun bir politikanın üç elle yazılmış kopyası zamanla birbirinden SESSİZCE ayrılabilir —
# dosyanın kendi uyarısının tam da işaret ettiği hata. Değişkene alıp üç yerde YALNIZCA
# referans vererek bunu imkânsızlaştırıyoruz; `map` de yalnızca http bağlamında geçerli ve
# bu dosya oraya include ediliyor (yukarıdaki $connection_upgrade ile aynı yer).
#
# Politikanın esnek noktaları BİLİNÇLİ ve başlangıç düzeyidir (tam kilit ERTELENDİ):
#   • style-src 'unsafe-inline' — React bileşenleri satır içi style={{…}} kullanıyor;
#     kaldırmak nonce/hash altyapısı ister, ayrı bir iş.
#   • *.google-analytics.com + googletagmanager.com — GA4 rıza sonrası buradan yükleniyor
#     (frontend/src/lib/analytics.js). GA kapalıyken bu kaynaklara hiç gidilmez.
#   • connect-src api.<alan> + wss://api.<alan> — API çağrıları ve SignalR sohbeti.
# script-src'te 'unsafe-inline' YOK: Vite üretim derlemesi satır içi <script> üretmiyor
# (yalnızca /assets/*.js), GA da harici src ile geliyor — koklama saldırısına kapı yok.
map $host $frontend_csp {
    default "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://api.dersmate.com wss://api.dersmate.com https://*.google-analytics.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
}

# SignalR hub'ları için SORGU DİZESİNİ MASKELEYEN erişim günlüğü biçimi.
#
# WebSocket tarayıcıda Authorization başlığı TAŞIYAMAZ; SignalR bu yüzden erişim
# token'ını `?access_token=...` sorgu dizesinde yollar (bkz. Program.cs OnMessageReceived,
# frontend useChatHub.js accessTokenFactory). Bu SignalR için olağan ve pratikte
# kaçınılmaz. Ama nginx'in varsayılan `combined` biçimi `$request` ile TAM istek satırını
# loglar — yani `GET /hubs/chat?access_token=<JWT> HTTP/1.1`. Token böylece erişim
# günlüğünde (ve log'u toplayan her ara katmanda) düz metin olarak kalırdı; günlüğü
# okuyabilen biri 2 saat geçerli bir erişim token'ını ele geçirebilirdi.
#
# Bu biçim `$request` yerine `$request_method $uri` yazar: `$uri` normalize edilmiş
# YOLDUR, sorgu dizesi İÇERMEZ. Hub trafiği yine loglanır (IP, yöntem, yol, durum),
# yalnızca token düşer. `log_format` da `map` gibi yalnızca http bağlamında geçerli ve
# bu dosya oraya include ediliyor.
log_format hub_masked '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

# HTTP → HTTPS. Tek işi yönlendirmek; başka hiçbir şey servis etmiyor.
server {
    listen 80;
    listen [::]:80;
    server_name dersmate.com www.dersmate.com api.dersmate.com;

    # Let's Encrypt doğrulaması yönlendirmenin ÖNÜNDE kalmalı, yoksa sertifika
    # yenileme her seferinde 301 alır ve sessizce başarısız olur.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www OLMAYANI www'YE YÖNLENDİR
#
# ⚠️ BU BLOK BİR SÜS DEĞİL. API'nin CORS listesi TEK adres alıyor
# (docker-compose.prod.yml: `Cors__Origins__0: ${PUBLIC_WEB_URL}`). İki alan adı da
# aynı blokta sunulsaydı, kullanıcı diğerine girdiğinde arayüz YÜKLENİR ama her API
# çağrısı CORS'tan patlar — giriş çalışmaz, listeler gelmez ve sebep yalnızca tarayıcı
# konsolunda kalır. Tek kanonik adres, tek CORS kaydı.
#
# Kanonik adres www: afişte ve tanıtımda o yazıyor. Tersini seçersen buradaki ve
# aşağıdaki `server_name` satırlarını birlikte çevir, PUBLIC_WEB_URL'i de.
#
# 80 portunu dinleyen blok değişmiyor: ACME doğrulama yolu orada ve sertifika
# yenilemesi ona bağlı.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dersmate.com;

    ssl_certificate     /etc/letsencrypt/live/dersmate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dersmate.com/privkey.pem;

    # HSTS YÖNLENDİRMEDE DE VERİLİYOR — tek satırlık ama gerçek bir boşluk kapatıyor.
    # `includeSubDomains` www.dersmate.com'dan geldiğinde www'nin ALT alanlarını kapsıyor,
    # KÖK alan adını değil. Burası olmadan `dersmate.com` hiçbir zaman HSTS politikası
    # öğrenmezdi: kullanıcı bir daha http://dersmate.com yazdığında tarayıcı yine
    # şifresiz istekle başlar ve yönlendirmeden önceki o tek istek araya girmeye açıktır.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://www.dersmate.com$request_uri;
}

# ---------------------------------------------------------------------------
# ARAYÜZ (statik dosyalar)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.dersmate.com;

    ssl_certificate     /etc/letsencrypt/live/dersmate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dersmate.com/privkey.pem;

    # HSTS burada da veriliyor: statik dosyalar uygulamadan geçmiyor, yani
    # uygulamanın UseHsts'i bu yanıtlara başlık ekleyemez.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $frontend_csp always;

    # frontend/dist — VITE_API_URL verilerek derlenmiş olmalı (§2).
    #
    # ⚠️ BU YOL, docker-compose.prod.yml'nin BAĞLADIĞI yol olmak zorunda. Compose,
    # ./frontend/dist dizinini konteynerin içinde /usr/share/nginx/html'e bağlıyor;
    # başka bir kök yazılırsa konteynerde o dizin HİÇ YOKTUR ve try_files fallback'i de
    # bulunamayacağı için sitenin her adresi 404 döner — index.html dahil.
    root /usr/share/nginx/html;
    index index.html;

    # Tek sayfalık uygulama: bilinmeyen yol index.html'e düşer, 404'e değil.
    # Bu olmadan /gizlilik gibi doğrudan açılan adresler nginx 404'ü verir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'li varlıklar uzun önbellek, index.html asla.
    #
    # index.html önbelleklenirse dağıtımdan sonra tarayıcı ESKİ index'i tutar ve o
    # index artık var olmayan (hash'i değişmiş) js dosyasını ister → beyaz ekran.
    # ⚠️ GÜVENLİK BAŞLIKLARI AŞAĞIDA TEKRARLANIYOR — GEREKSİZ KOPYA DEĞİL, ZORUNLU.
    #
    # nginx kuralı: `add_header` üst seviyeden YALNIZCA bu seviyede hiç `add_header`
    # yoksa miras alınır. Bir tane bile yazarsan üsttekilerin HEPSİ düşer.
    #
    # Bu iki blokta Cache-Control için `add_header` var; o yüzden server seviyesindeki
    # BEŞ güvenlik başlığı (HSTS / nosniff / Referrer-Policy / X-Frame-Options / CSP) buraya
    # İNMEZ. Tekrarlanmazsa ana sayfa (location = /index.html) ve bütün JS/CSS dosyaları
    # güvenlik başlıksız servis edilir — yani pratikte sitenin tamamı. CSP değişkeni
    # ($frontend_csp) sayesinde politika metni tek yerde durur, ama add_header SATIRININ
    # kendisi yine her location'da tekrar edilmek zorunda (miras kuralı satırı arar, değeri değil).
    #
    # Gerçek kurulumda yakalandı (2026-09-04): canlıda `curl -D -` başlıkları
    # göstermiyordu, oysa server bloğunda yazılılardı. Sessiz bir kayıp — yapılandırma
    # doğru görünüyor, `nginx -t` geçiyor, hiçbir uyarı çıkmıyor.
    #
    # Yeni bir `add_header` içeren location eklersen BEŞİNİ de oraya yaz.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $frontend_csp always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $frontend_csp always;
    }
}

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dersmate.com;

    # ⚠️ YOL `dersmate.com`, `api.dersmate.com` DEĞİL — sertifika TEK.
    #
    # Kurulum kılavuzu certbot'u üç alan adını TEK komutta vererek çağırıyor
    # (`-d dersmate.com -d www... -d api...`). Certbot bunları tek bir sertifikada
    # topluyor ve klasörü İLK alan adıyla adlandırıyor: live/dersmate.com/.
    # `api.dersmate.com` sertifikanın İÇİNDE (SAN olarak) duruyor, dosya sisteminde
    # ayrı bir klasör OLUŞMUYOR.
    #
    # Buraya live/api.dersmate.com/ yazılırsa nginx açılışta "cannot load certificate"
    # ile düşer — ve teşhis zordur, çünkü sertifika gerçekten alınmıştır.
    # (Gerçek kurulumda yakalandı: 2026-09-04.)
    ssl_certificate     /etc/letsencrypt/live/dersmate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dersmate.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Güvenlik başlıkları BURADA da veriliyor. Gerekçe: uygulama bu üçünü zaten her yanıta
    # ekliyor (SecurityHeadersMiddleware) ve nginx onları proxy'den geçirir — ama nginx'in
    # KENDİ ürettiği yanıtlar (12m aşımında 413, API kapalıyken 502, /health/ready'de 403)
    # uygulamaya hiç uğramaz ve o başlıkları taşımaz. `always` ile hata yanıtları da kapsanır.
    # Uygulama yanıtlarında başlığın iki kez görünmesi zararsız ve BİLİNÇLİ; tıpkı yukarıdaki
    # HSTS gibi (o da hem burada hem UseHsts'te veriliyor). Değerler uygulamadakiyle birebir
    # aynı tutulmalı.
    #
    # CSP BİLEREK EKLENMİYOR: uygulama API yanıtlarına "default-src 'none'" koyuyor; nginx de
    # farklı bir CSP eklerse tarayıcı İKİSİNİN KESİŞİMİNİ uygular ve beklenmedik biçimde
    # kısıtlar. CSP'nin tek sahibi uygulama olsun. nginx'in statik hata sayfaları (script
    # içermeyen düz metin) nosniff ile zaten korunuyor.
    #
    # Yüklenen kanıt/belge dosyalarının "attachment" olarak (inline değil) servisi de
    # uygulama tarafında: bkz. KullaniciDosyaServisi. Depoya nginx doğrudan erişmiyor.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ders kanıtı görselleri yükleniyor; varsayılan 1 MB yetmez.
    client_max_body_size 12m;

    # HAZIRLIK UCU DIŞARIYA KAPALI.
    #
    # /health/ready kimlik istemiyor, hız sınırından MUAF (RateLimiting.cs "/health" ile
    # başlayan her yolu muaf tutuyor) ve her istekte veritabanına gerçek bir bağlantı
    # açıyor. Üstelik yanıt gövdesi bileşen bileşen durum ve açıklama metni döndürüyor —
    # yani dışarıdan bakan biri hem altyapının parçalarını öğrenir hem de sınırsız
    # sayıda veritabanı bağlantısı tetikleyebilir.
    #
    # Sağlık kontrolü zaten konteyner içinden yapılıyor (compose healthcheck), yani
    # dışarıya açık olmasına gerek yok. /health (yalnızca "ayakta mıyım") açık kalıyor.
    location = /health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # ── SignalR hub'ları — SORGU DİZESİ LOGLANMAZ ────────────────────────────
    #
    # Bu location tek bir amaçla `location /`'dan AYRILDI: erişim token'ı sorgu
    # dizesinde geldiği için (yukarıdaki hub_masked açıklaması) hub istekleri
    # maskelenmiş biçimle loglanmalı. Vekilleme, WebSocket yükseltmesi ve uzun zaman
    # aşımı `location /` ile BİREBİR AYNI — yalnızca access_log satırı fazladan.
    #
    # ⚠️ `location /`'daki proxy ayarları burada MİRAS ALINMAZ; her biri tekrar
    # yazılmak zorunda. Biri unutulursa hub bağlantısı sessizce kopar. `location /`
    # değişirse burası da elle güncellenmeli.
    #
    # Yol `/hubs/`: hub `/hubs/chat` altında (Program.cs MapHub), negotiate/WebSocket
    # istekleri de bu önekin altında. add_header YAZILMIYOR — böylece sunucu
    # seviyesindeki güvenlik başlıkları (nosniff / X-Frame-Options / Referrer-Policy /
    # HSTS) miras kalır; bir add_header eklemek beşini birden düşürürdü.
    location /hubs/ {
        # Maskelenmiş biçim (sorgu dizesi = access_token yok). Aynı dosyaya yazılıyor
        # ki hub erişimi de standart günlük akışında görünsün.
        access_log /var/log/nginx/access.log hub_masked;

        proxy_pass http://api:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    location / {
        # ⚠️ KONTEYNER AĞI ADRESİ — 127.0.0.1 DEĞİL.
        #
        # nginx kendi konteynerinde (compose'daki `web` servisi) çalışıyor; oradaki
        # 127.0.0.1 nginx'in KENDİ loopback'idir ve hiçbir şey dinlemez. API'ye compose
        # ağındaki servis adıyla gidilir: `api`, portu Dockerfile'daki EXPOSE 8080.
        #
        # Compose'daki `127.0.0.1:5000:8080` eşlemesi HOST üzerindedir ve yalnızca
        # sunucuda elle curl atmak içindir; nginx onu kullanmaz.
        #
        # Yanlış yazılırsa teşhis zordur: `docker compose ps` dört servisi de healthy
        # gösterir, TLS çalışır, ama api.<alan> üzerindeki HER istek 502 döner.
        proxy_pass http://api:8080;

        proxy_set_header Host              $host;
        # Bu iki başlık OLMADAN uygulamanın UseForwardedHeaders'ı işe yaramaz:
        # gerçek istemci IP'si ve şema kaybolur.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR (sohbet) WebSocket yükseltmesi.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket bağlantısı uzun yaşar; varsayılan 60 sn onu sürekli koparırdı.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
