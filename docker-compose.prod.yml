# ─────────────────────────────────────────────────────────────────────────────
# dersmate — ÜRETİM yığını. Tek sunucu, dört servis.
#
# docker-compose.yml (geliştirme) ile karıştırma: o dosya yalnızca PostgreSQL ve
# Redis'i ayağa kaldırır, uygulamayı sen kendi makinende koşarsın. BU dosya
# uygulamanın kendisini de çalıştırır ve önüne nginx koyar.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#   docker compose -f docker-compose.prod.yml down          → durdur (VERİ KALIR)
#
# ⛔ AYARLAR BU DOSYADA DEĞİL, `.env.production` DOSYASINDA. O dosya .gitignore'da ve
#    depoya asla girmez. Şablonunu üretmek için: tools/uretim-ayarlari-uret.ps1
#
# Kurulumun tamamı (alan adı, TLS, ilk yönetici): docs/SUNUCUYA-KURULUM.md
# ─────────────────────────────────────────────────────────────────────────────

name: dersmate

# ─────────────────────────────────────────────────────────────────────────────
# GÜNLÜK DÖNDÜRME — her servise uygulanıyor (aşağıda `<<: *gunluk`).
#
# ⛔ BU OLMADAN DİSK SESSİZCE DOLAR. Docker'ın varsayılan json-file sürücüsünde
# BOYUT SINIRI YOKTUR: konteyner günlükleri sonsuza kadar büyür. API her isteği
# ve her SQL komutunu yazıyor; birkaç ay sonra 40 GB'lık diski dolduran şey
# veritabanı değil, günlük dosyası olur.
#
# Arıza da tanınması zor biçimde gelir: PostgreSQL yazamaz hâle gelir, uygulama
# "disk full" yerine anlaşılmaz veritabanı hataları döndürür.
#
# 3 × 10 MB = servis başına en fazla 30 MB. Teşhis için son birkaç saat yeterli;
# daha uzun saklama gerekiyorsa günlükler dışarı aktarılmalı (sunucuda tutulmaz).
# ─────────────────────────────────────────────────────────────────────────────
x-gunluk: &gunluk
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  # ───────────────────────────────────────────────────────────────────────────
  db:
    <<: *gunluk
    image: postgres:16-alpine
    container_name: dersmate-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB tanımsız — .env.production eksik}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER tanımsız}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımsız}

      # Sıralama 'C' — geliştirmedeki ile AYNI olmak zorunda. Farklı olursa aynı sorgu
      # iki ortamda farklı sıralar ve daha kötüsü: kısmi/filtreli index'ler ile ICU
      # kolasyonlu kolonlar arasındaki uyumsuzluk sessizce index kullanılmamasına yol
      # açar (bkz. SearchUniversityPeers'taki kolasyon notu).
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'

    # ⚠️ PORT DIŞARIYA AÇILMIYOR. Yalnızca compose ağındaki servisler erişebilir.
    # `5432:5432` yazmak veritabanını internete açar ve Windows/Linux güvenlik duvarı
    # bunu sormaz — bu, tek satırla verilen en pahalı hatalardan biri.
    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────────────
  cache:
    <<: *gunluk
    image: redis:7-alpine
    container_name: dersmate-cache
    restart: unless-stopped

    # KALICILIK KAPALI (--save '' --appendonly no) ve bu bilinçli: Redis burada
    # dağıtık KİLİT ve önbellek tutuyor, kalıcı veri değil. Yeniden başlayan bir
    # konteyner eski kilitleri geri yükleseydi "cüzdan kilidi alınamadı" hataları
    # sebepsiz görünürdü. Kaybolması gereken veri, kaybolmalı.
    command: ['redis-server', '--save', '', '--appendonly', 'no']

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  api:
    <<: *gunluk
    build:
      context: .
      dockerfile: Dockerfile
    image: dersmate-api:latest
    container_name: dersmate-api
    restart: unless-stopped

    # SIRALAMA ÖNEMLİ: API açılışta göç kontrolü yapıyor ve Redis'e bağlanıyor.
    # `service_healthy` olmadan API, veritabanı henüz açılmamışken başlar ve
    # "connection refused" ile döngüye girer — restart:unless-stopped bunu sonsuz
    # bir yeniden başlatma çevrimine çevirir.
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Konteyner adları DNS adı olarak çalışıyor (compose ağı).
      ConnectionStrings__Postgres: 'Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}'
      ConnectionStrings__Redis: 'cache:6379'

      Jwt__Key: ${JWT_KEY:?JWT_KEY tanımsız — tools/uretim-ayarlari-uret.ps1 ile üretin}
      Jwt__ExposeVerificationTokenInResponse: 'false'

      Cors__Origins__0: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL tanımsız}

      Email__Provider: Smtp
      Email__Host: ${SMTP_HOST:?SMTP_HOST tanımsız}
      Email__Port: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME}
      Email__Password: ${SMTP_PASSWORD}
      Email__FromAddress: ${SMTP_FROM:?SMTP_FROM tanımsız}
      Email__PublicWebUrl: ${PUBLIC_WEB_URL}

      # ⚠️ AÇIKÇA VERİLİYOR. appsettings.json üretimde de taban yapılandırma olarak
      # yükleniyor ve içindeki geliştirme değerleri (2000/20000) koddaki güvenli
      # varsayılanları EZİYOR. Verilmezse giriş ucu dakikada 2000 parola denemesine
      # açık kalır (bkz. docs/URETIME-CIKIS.md §1).
      RateLimit__AuthPerMinute: ${RATE_AUTH_PER_MINUTE:-10}
      RateLimit__GlobalPerMinute: ${RATE_GLOBAL_PER_MINUTE:-300}

      # EF Core'un sorgu günlüğü ÜRETİMDE kapalı. appsettings.json'da Logging:Default
      # Information ve EntityFrameworkCore için ayrı bir seviye yok; o hâliyle çalışan
      # HER sorgunun metni konteyner günlüğüne düşer. Sonuç: istek başına birden çok
      # satır, dönüşüm tanımlı olmadığı için hızla dolan disk ve gerçek hata satırlarının
      # gürültüde kaybolması. Geliştirmede sorgular görünmeye devam ediyor (bu değişken
      # yalnızca burada tanımlı) — orada sorgu görmek bilinçli bir kolaylık.
      Logging__LogLevel__Microsoft.EntityFrameworkCore: ${LOG_EF_CORE:-Warning}

    volumes:
      # ⛔ KANIT DOSYALARI. Bu hacim olmadan kanıtlar konteynerle birlikte silinir ve
      # itiraz hakemliğinin tek dayanağı kaybolur. Yedeğe DAHİL EDİLMELİ
      # — tools/yedek-al.sh veritabanını VE bu hacmi birlikte alıyor (bkz.
      # docs/SUNUCUYA-KURULUM.md §10). İkisini ayrı almak anlamsızdır: kanıt satırı
      # veritabanında, dosyası bu hacimde durur.
      - proof-storage:/var/lib/dersmate/proof-storage

    # Port SADECE loopback'e. nginx aynı ağda olduğu için `api:8080` ile erişiyor;
    # bu satır yalnızca sunucuda elle teşhis (curl) yapabilmek için.
    ports:
      - '127.0.0.1:5000:8080'

  # ───────────────────────────────────────────────────────────────────────────
  web:
    <<: *gunluk
    image: nginx:1.27-alpine
    container_name: dersmate-web
    restart: unless-stopped

    depends_on:
      api: { condition: service_healthy }

    ports:
      - '80:80'
      - '443:443'

    volumes:
      # Yapılandırma: tools/ornek-nginx.conf'u kopyalayıp alan adlarını değiştirin.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # Arayüz paketi. SUNUCUDA DERLENMİYOR: `npm run build` çıktısı (frontend/dist)
      # buraya kopyalanıyor. Derlemeyi sunucuya taşımak, node_modules'ü ve derleme
      # zamanı hatalarını üretim makinesine taşımak demekti.
      - ./frontend/dist:/usr/share/nginx/html:ro

      # Let's Encrypt sertifikaları ve ACME doğrulama kökü.
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro

  # ───────────────────────────────────────────────────────────────────────────
  # Sertifika yenileme. 12 saatte bir uyanıp süresi yaklaşan sertifikayı yeniliyor;
  # Let's Encrypt sertifikaları 90 gün geçerli ve yenileme UNUTULURSA site bir gün
  # aniden erişilemez olur — en sık yapılan işletim hatası bu.
  certbot:
    <<: *gunluk
    image: certbot/certbot:latest
    container_name: dersmate-certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  db-data:
  proof-storage:
